<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprobante de conversión · Castle Crypto Income</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(1200px 700px at 50% -10%, #8b94a3 0%, transparent 60%),
      linear-gradient(180deg, #767f8e 0%, #5e6675 100%);
    background-attachment: fixed;
    font-family: var(--font-ui);
    min-height: 100vh;
    padding: 0 0 80px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── screen chrome ───────────────────────────── */
  .toolbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    padding: 14px 24px;
    background: rgba(20,33,47,0.82);
    backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid rgba(201,168,76,0.28);
  }
  .toolbar .brand {
    display: flex; align-items: center; gap: 11px;
    color: #fff; font-family: var(--font-display);
    font-size: 17px; letter-spacing: 0.3px;
  }
  .toolbar .brand img { width: 26px; height: 26px; object-fit: contain; }
  .toolbar .brand span { color: rgba(255,255,255,0.5); font-size: 12px; font-family: var(--font-data); letter-spacing: 0.14em; text-transform: uppercase; }
  .toolbar .actions { display: flex; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-ui); font-size: 13px; font-weight: 600;
    padding: 9px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; transition: transform .25s var(--ease-spring), box-shadow .3s, background .2s;
  }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn-primary { background: var(--cc-gold); color: var(--cc-midnight); box-shadow: var(--shadow-gold); }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-ghost { background: rgba(255,255,255,0.06); color: #fff; border-color: rgba(255,255,255,0.18); }
  .btn-ghost:hover { background: rgba(255,255,255,0.12); }

  .board {
    max-width: 900px; margin: 0 auto; padding: 40px 24px 0;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .sheet-label {
    align-self: flex-start; margin-left: max(0px, calc(50% - 99mm));
    display: flex; align-items: center; gap: 12px;
    font-family: var(--font-data); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(255,255,255,0.92); font-weight: 600;
    margin-top: 22px;
  }
  .sheet-label .pill {
    padding: 3px 10px; border-radius: 999px; font-size: 10px;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .sheet-label .pill.gold { background: var(--cc-gold); color: var(--cc-midnight); border-color: transparent; }
  .sheet-label .pill.dark { background: var(--cc-midnight); color: var(--cc-gold-light); border-color: rgba(201,168,76,0.5); }

  /* ── the A4 sheet ────────────────────────────── */
  .sheet {
    width: 210mm; min-height: 297mm;
    position: relative; overflow: hidden;
    box-shadow: 0 30px 70px -28px rgba(0,0,0,0.55), 0 6px 18px rgba(0,0,0,0.18);
    border-radius: 3px;
    --pad: 16mm;
  }
  .doc { position: relative; z-index: 2; padding: var(--pad); min-height: 297mm; display: flex; flex-direction: column; }

  /* theme: light (Oxford White) */
  .sheet.light {
    background: var(--cc-oxford-soft);
    --paper: var(--cc-oxford-soft);
    --panel: #ffffff;
    --txt: #16263b;
    --txt-2: #46566e;
    --txt-3: #7b8699;
    --line: #e4e2da;
    --line-soft: #efece4;
    --accent: var(--cc-gold);
    --accent-ink: var(--cc-gold-deep);
    --band: linear-gradient(120deg, var(--cc-midnight), var(--cc-imperial));
    --band-txt: #fff;
    --sig-ink: var(--cc-midnight);
    --seal: var(--cc-gold-deep);
    --wm-opacity: 0.05;
    --chip-bg: rgba(43,84,151,0.07);
    --chip-bd: rgba(43,84,151,0.18);
  }
  /* theme: dark (Midnight) */
  .sheet.dark {
    background:
      radial-gradient(120% 80% at 18% 0%, rgba(43,84,151,0.30), transparent 55%),
      radial-gradient(90% 70% at 100% 100%, rgba(201,168,76,0.10), transparent 55%),
      linear-gradient(160deg, var(--cc-midnight) 0%, var(--cc-deep-slate) 100%);
    --paper: var(--cc-midnight);
    --panel: rgba(255,255,255,0.035);
    --txt: #f3f6fb;
    --txt-2: #b9c8dd;
    --txt-3: #7f93ad;
    --line: rgba(122,160,210,0.22);
    --line-soft: rgba(122,160,210,0.13);
    --accent: var(--cc-gold);
    --accent-ink: var(--cc-gold-light);
    --band: linear-gradient(120deg, rgba(255,255,255,0.05), rgba(255,255,255,0.0));
    --band-txt: #fff;
    --sig-ink: var(--cc-gold-light);
    --seal: var(--cc-gold);
    --wm-opacity: 0.06;
    --chip-bg: rgba(201,168,76,0.10);
    --chip-bd: rgba(201,168,76,0.32);
  }

  /* watermark */
  .watermark {
    position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
  }
  .watermark .emblem {
    position: absolute; top: 50%; left: 50%; width: 118mm;
    transform: translate(-50%, -52%) rotate(0deg);
    opacity: var(--wm-opacity);
  }
  .watermark .word {
    position: absolute; bottom: 40mm; left: -8mm; right: -8mm;
    text-align: center;
    font-family: var(--font-display); font-style: italic;
    font-size: 30mm; letter-spacing: 2mm; line-height: 1;
    color: var(--txt); opacity: calc(var(--wm-opacity) * 0.7);
    transform: rotate(-4deg);
    white-space: nowrap;
  }

  /* ── header ──────────────────────────────────── */
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
  .head .mark { display: flex; align-items: center; gap: 12px; }
  .head .mark img { width: 46px; height: 46px; object-fit: contain; }
  .head .mark .wm-name { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; letter-spacing: 0.4px; color: var(--txt); }
  .head .mark .wm-tag { font-family: var(--font-data); font-size: 8.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent-ink); margin-top: 5px; }
  .head .mark .wm-tag b { color: var(--txt-3); font-weight: 500; margin: 0 2px; }
  .head .doctype { text-align: right; }
  .head .doctype .ey { font-family: var(--font-data); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-ink); font-weight: 600; }
  .head .doctype .prod {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 7px; white-space: nowrap;
    font-family: var(--font-ui); font-size: 11px; font-weight: 600; color: var(--txt-2);
    padding: 4px 10px; border-radius: 999px; background: var(--chip-bg); border: 1px solid var(--chip-bd);
  }
  .head .doctype .prod i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }

  .rule { height: 2px; margin: 16px 0 0; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 80px, color-mix(in srgb, var(--accent) 22%, transparent) 160px, transparent 100%); }

  /* ── title row ───────────────────────────────── */
  .titlerow { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: 22px; }
  .titlerow h1 {
    font-family: var(--font-display); color: var(--txt); margin: 0;
    font-size: 33px; font-weight: 600; line-height: 1.05; letter-spacing: -0.3px;
  }
  .titlerow h1 em { font-style: italic; color: var(--accent-ink); }
  .titlerow h1 .gold { color: var(--cc-gold); }
  .titlerow .sub { font-family: var(--font-ui); color: var(--txt-2); font-size: 12.5px; margin-top: 7px; max-width: 78mm; }
  .refbox { text-align: right; flex: none; }
  .refbox .lab { font-family: var(--font-data); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--txt-3); }
  .refbox .ref {
    font-family: var(--font-data); font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: 17px; color: var(--accent-ink); margin-top: 2px; letter-spacing: 0.5px; white-space: nowrap;
  }
  .refbox .date { font-family: var(--font-data); font-size: 11px; color: var(--txt-2); margin-top: 10px; font-variant-numeric: tabular-nums; }
  .refbox .date .lab2 { display: block; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--txt-3); margin-bottom: 2px; }

  /* ── client constancia ───────────────────────── */
  .constancia { margin-top: 22px; font-family: var(--font-ui); color: var(--txt-2); font-size: 12.5px; line-height: 1.55; }
  .client {
    margin-top: 12px; display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 10px;
  }
  .client .who { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--txt); line-height: 1; }
  .client .who-lab { font-family: var(--font-data); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--txt-3); margin-bottom: 5px; }

  /* ── conversion flow ─────────────────────────── */
  .sec-eyebrow { font-family: var(--font-data); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-ink); font-weight: 600; margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
  .sec-eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .flow { display: grid; align-items: stretch; gap: 0; }
  .flow-3 { grid-template-columns: 1fr auto 1fr auto 1fr; }
  .flow-2 { grid-template-columns: 1fr auto 1fr; }
  .fcell {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; position: relative;
  }
  .fcell.accent { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent) inset; }
  .fcell .k { font-family: var(--font-data); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--txt-3); }
  .fcell .v { font-family: var(--font-data); font-variant-numeric: tabular-nums lining-nums; font-weight: 600; color: var(--txt); font-size: 22px; line-height: 1.05; margin-top: 7px; white-space: nowrap; }
  .fcell.accent .v { color: var(--accent-ink); }
  .fcell .cur { font-size: 13px; font-weight: 500; color: var(--txt-3); margin-left: 5px; }
  .fcell .note { font-family: var(--font-ui); font-size: 10.5px; color: var(--txt-2); margin-top: 6px; }
  .farrow { display: flex; align-items: center; justify-content: center; padding: 0 8px; }
  .farrow svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .farrow .lab { display: none; }

  /* ── detail table ────────────────────────────── */
  .detail { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .drow { display: grid; grid-template-columns: 52mm 1fr; gap: 0; border-bottom: 1px solid var(--line-soft); }
  .drow:last-child { border-bottom: 0; }
  .drow .dk {
    font-family: var(--font-ui); font-size: 11.5px; color: var(--txt-2); font-weight: 500;
    padding: 13px 18px; background: color-mix(in srgb, var(--txt) 3%, transparent);
    display: flex; align-items: center; gap: 9px; border-right: 1px solid var(--line-soft);
  }
  .drow .dk svg { width: 15px; height: 15px; stroke: var(--accent-ink); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .drow .dv { padding: 13px 18px; font-family: var(--font-ui); font-size: 13px; color: var(--txt); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .drow .dv.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: 0.3px; word-break: break-all; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
    font-family: var(--font-data); font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  }
  .badge.asset { background: var(--chip-bg); border: 1px solid var(--chip-bd); color: var(--txt); }
  .badge.net { background: rgba(124,93,250,0.10); border: 1px solid rgba(124,93,250,0.34); color: color-mix(in srgb, #7c5dfa 70%, var(--txt)); }
  .badge.ok { background: color-mix(in srgb, var(--cc-positive) 14%, transparent); border: 1px solid color-mix(in srgb, var(--cc-positive) 40%, transparent); color: var(--cc-positive-2); }
  .sheet.dark .badge.ok { color: #7fd089; }
  .badge svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .badge.asset .tok { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, #2775ca, #2775ca); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; }
  .dv .hashfull { color: var(--txt-2); font-size: 11.5px; }

  /* ── ownership note ──────────────────────────── */
  .ownership {
    margin-top: 18px; display: flex; gap: 13px; padding: 15px 18px; border-radius: 12px;
    background: color-mix(in srgb, var(--accent) 9%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .ownership svg { width: 19px; height: 19px; flex: none; margin-top: 1px; stroke: var(--accent-ink); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .ownership .ot { font-family: var(--font-ui); font-size: 11.5px; line-height: 1.5; color: var(--txt-2); }
  .ownership .ot strong { color: var(--txt); font-weight: 600; }
  .ownership .ot em { font-style: italic; color: var(--accent-ink); font-weight: 500; }

  /* ── signature + seal ────────────────────────── */
  .signrow { margin-top: auto; padding-top: 30px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .signblock { width: auto; max-width: 110mm; position: relative; }
  .sig {
    display: block; height: 30mm; width: auto; max-width: 84mm;
    object-fit: contain; object-position: left bottom; margin-bottom: -1mm;
  }
  .sigline { border-top: 1.5px solid var(--txt-2); padding-top: 8px; width: fit-content; }
  .signblock .nm { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--txt); white-space: nowrap; }
  .signblock .role { font-family: var(--font-ui); font-size: 10.5px; color: var(--txt-3); margin-top: 2px; }
  .signblock .role b { color: var(--accent-ink); font-weight: 600; }

  .seal {
    width: 33mm; height: 33mm; position: relative; flex: none;
    transform: rotate(-7deg); opacity: 0.92;
  }
  .seal .ring { position: absolute; inset: 0; }
  .seal .ring text { font-family: var(--font-data); font-size: 7.1px; letter-spacing: 1.4px; fill: var(--seal); font-weight: 600; text-transform: uppercase; }
  .seal .body {
    position: absolute; inset: 16%; border-radius: 50%;
    border: 1.5px solid var(--seal); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    color: var(--seal);
  }
  .seal .body { overflow: hidden; padding: 1.6mm; }
  .seal .body img { width: 11mm; max-width: 100%; opacity: 0.92; }
  .seal .body .cci { font-family: var(--font-data); font-size: 6.5px; letter-spacing: 0.18em; font-weight: 700; }
  .seal .outer { position: absolute; inset: 7%; border-radius: 50%; border: 1px solid var(--seal); opacity: 0.55; }

  /* ── footer ──────────────────────────────────── */
  .foot { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .foot .tag { font-family: var(--font-display); font-style: italic; font-size: 12px; color: var(--txt-2); }
  .foot .tag i { color: var(--accent); font-style: normal; margin: 0 7px; }
  .foot .meta { font-family: var(--font-data); font-size: 9px; letter-spacing: 0.06em; color: var(--txt-3); text-align: right; }

  /* ── responsive (screen only) ────────────────── */
  @media (max-width: 880px) {
    .sheet { transform: scale(var(--fit, 1)); transform-origin: top center; }
    .board { padding-left: 8px; padding-right: 8px; }
  }

  /* ── print ───────────────────────────────────── */
  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .sheet-label { display: none !important; }
    .board { padding: 0; max-width: none; gap: 0; display: block; }
    .sheet {
      box-shadow: none; border-radius: 0; margin: 0;
      width: 210mm; height: 297mm; min-height: 297mm;
      page-break-after: always; break-after: page;
      transform: none !important;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .sheet:last-child { page-break-after: auto; break-after: auto; }

    /* ── fit everything onto a single A4 page ── */
    .sheet { --pad: 10mm; }
    .rule { margin-top: 11px; }
    .titlerow { margin-top: 12px; }
    .constancia { margin-top: 12px; }
    .client { margin-top: 8px; padding: 9px 16px; }
    .sec-eyebrow { margin: 14px 0 8px; }
    .fcell { padding: 11px 16px; }
    .fcell .v { font-size: 20px; }
    .drow .dk { padding: 8px 16px; }
    .drow .dv { padding: 8px 16px; }
    .ownership { margin-top: 11px; padding: 10px 16px; }
    .signrow { padding-top: 14px; }
    .foot { margin-top: 12px; padding-top: 8px; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="brand">
      <img src="assets/logo-line-white.png" alt="Castle Capital">
      Castle Capital&nbsp;<span>Comprobante de conversión</span>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="window.print()">
        <svg viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
        Imprimir / Guardar PDF
      </button>
    </div>
  </div>

  <div class="board" id="board"></div>

<script>
const DATA = {
  cliente: "Camila Restrepo Vélez",
  efectivo: "8.100.000",
  monedaEfectivo: "COP",        // "COP" o "USD" — si es USD se omite el paso de tasa
  tasa: "1 USD = $ 4.050 COP",
  usd: "2.000,00",
  usdc: "2.000,00",
  activo: "USDC",
  activoNombre: "USD Coin",
  red: "Polygon (PoS)",
  wallet: "0xb132***b84a",
  hash: "0x7d4af1c9e2b3a06f5c8d1e4b9a72f3c6d05e8b41a9c2f7e63b1d8a04c5f9e2b7a",
  fecha: "7 de junio de 2026",
  hora: "14:32 (GMT-5)",
  ref: "CCI-b84a-0001",
};

const ICON = {
  asset:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.2 9.3c0-1 1.3-1.6 2.8-1.6s2.8.6 2.8 1.6-1.1 1.4-2.8 1.6c-1.7.2-2.8.7-2.8 1.7s1.3 1.7 2.8 1.7 2.8-.7 2.8-1.7"/></svg>',
  net:    '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M10.7 6.7 6.3 15.5M13.3 6.7l4.4 8.8M7.4 18h9.2"/></svg>',
  wallet: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v1H5a2 2 0 0 0 0 4h0M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5H6"/><circle cx="16" cy="14" r="1"/></svg>',
  hash:   '<svg viewBox="0 0 24 24"><path d="M9 3 7 21M17 3l-2 18M4 8h16M3 16h16"/></svg>',
  date:   '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>',
  status: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.3 2.3 4.7-4.6"/></svg>',
};

function render(theme){
  const sigRing = `
    <svg class="ring" viewBox="0 0 100 100">
      <defs><path id="cap-${theme}" d="M50,50 m-39,0 a39,39 0 1,1 78,0 a39,39 0 1,1 -78,0"/></defs>
      <text><textPath href="#cap-${theme}" startOffset="0">CASTLE CAPITAL · CONVERSIÓN VERIFICADA · ON-CHAIN · </textPath></text>
    </svg>`;
  const headLogo = theme === 'dark' ? 'assets/logo-line-white.png' : 'assets/logo-castle.png';
  const wmLogo   = theme === 'dark' ? 'assets/logo-line-white.png' : 'assets/logo-line-ink.png';
  const sealImg  = theme === 'dark' ? 'assets/logo-line-white.png' : 'assets/logo-line-ink.png';
  const sigImg   = theme === 'dark' ? 'assets/firma-gold.png' : 'assets/firma-ink.png';

  // Flujo de conversión — adapta a COP (con paso de tasa USD) o USD (directo a USDC)
  const isUSD  = DATA.monedaEfectivo === 'USD';
  const effDisp = (isUSD ? 'USD ' : '$ ') + DATA.efectivo;
  const arrow  = '<div class="farrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>';
  const effCell  = `<div class="fcell"><div class="k">Efectivo recibido</div><div class="v">${effDisp}<span class="cur">${DATA.monedaEfectivo}</span></div><div class="note">Recibido en efectivo</div></div>`;
  const usdCell  = `<div class="fcell"><div class="k">Equivalente en USD</div><div class="v">$ ${DATA.usd}<span class="cur">USD</span></div><div class="note">Tasa · ${DATA.tasa}</div></div>`;
  const usdcCell = `<div class="fcell accent"><div class="k">Cripto entregada</div><div class="v">${DATA.usdc}<span class="cur">USDC</span></div><div class="note">Depositado en wallet del cliente</div></div>`;
  const flow = isUSD
    ? `<div class="flow flow-2">${effCell}${arrow}${usdcCell}</div>`
    : `<div class="flow flow-3">${effCell}${arrow}${usdCell}${arrow}${usdcCell}</div>`;

  return `
  <div class="sheet ${theme}">
    <div class="watermark">
      <img class="emblem" src="${wmLogo}" alt="">
      <div class="word">Castle Capital</div>
    </div>
    <div class="doc">

      <div class="head">
        <div class="mark">
          <img src="${headLogo}" alt="Castle Capital">
          <div>
            <div class="wm-name">Castle Capital</div>
            <div class="wm-tag">Diseño<b>·</b>Estructura<b>·</b>Legado</div>
          </div>
        </div>
        <div class="doctype">
          <div class="ey">Comprobante de conversión</div>
          <div class="prod"><i></i> Castle Crypto Income</div>
        </div>
      </div>
      <div class="rule"></div>

      <div class="titlerow">
        <div>
          <h1>Comprobante de <span class="gold">conversión</span></h1>
        </div>
        <div class="refbox">
          <div class="lab">Referencia</div>
          <div class="ref">${DATA.ref}</div>
          <div class="date"><span class="lab2">Fecha de operación</span>${DATA.fecha}<br>${DATA.hora}</div>
        </div>
      </div>

      <div class="constancia">
        Castle Capital deja constancia de la recepción de efectivo y su conversión a activos digitales, entregados directamente a favor de:
      </div>
      <div class="client">
        <div>
          <div class="who-lab">Cliente / Titular</div>
          <div class="who">${DATA.cliente}</div>
        </div>
      </div>

      <div class="sec-eyebrow">Resumen de la conversión</div>
      ${flow}

      <div class="sec-eyebrow">Detalle de la operación</div>
      <div class="detail">
        <div class="drow">
          <div class="dk">${ICON.asset} Activo digital</div>
          <div class="dv"><span class="badge asset"><span class="tok">$</span> USDC</span> ${DATA.activoNombre}</div>
        </div>
        <div class="drow">
          <div class="dk">${ICON.net} Red blockchain</div>
          <div class="dv"><span class="badge net">${DATA.red}</span></div>
        </div>
        <div class="drow">
          <div class="dk">${ICON.wallet} Wallet del cliente</div>
          <div class="dv mono">${DATA.wallet}</div>
        </div>
        <div class="drow">
          <div class="dk">${ICON.hash} Hash de transacción</div>
          <div class="dv mono"><span class="hashfull">${DATA.hash}</span></div>
        </div>
        <div class="drow">
          <div class="dk">${ICON.status} Estado</div>
          <div class="dv"><span class="badge ok"><svg viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></svg> Confirmada on-chain</span></div>
        </div>
        <div class="drow">
          <div class="dk">${ICON.date} Fecha y hora</div>
          <div class="dv mono">${DATA.fecha} · ${DATA.hora}</div>
        </div>
      </div>

      <div class="ownership">
        <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <div class="ot">
          <strong>Propiedad y custodia.</strong> Los activos digitales descritos en este comprobante fueron entregados directamente a la wallet personal del cliente y son de su <strong>exclusiva propiedad y control</strong>. Castle Capital no custodia, retiene ni administra fondos de terceros: actúa <em>únicamente</em> como facilitador de la conversión. Una vez confirmada la transacción en la red, la responsabilidad sobre las claves privadas y los activos recae enteramente en el titular de la wallet.
        </div>
      </div>

      <div class="signrow">
        <div class="signblock">
          <img class="sig" src="${sigImg}" alt="Firma de Julián Castillo">
          <div class="sigline">
            <div class="nm">Julián Esteban Castillo Marulanda</div>
            <div class="role">CEO · <b>Castle Capital</b></div>
          </div>
        </div>
        <div class="seal">
          <div class="outer"></div>
          ${sigRing}
          <div class="body">
            <img src="${sealImg}" alt="">
            <div class="cci">CCI</div>
          </div>
        </div>
      </div>

      <div class="foot">
        <div class="tag">Diseño<i>·</i>Estructura<i>·</i>Legado</div>
        <div class="meta">Castle Capital · Armenia, Colombia<br>Comprobante ${DATA.ref} · verificable on-chain</div>
      </div>

    </div>
  </div>`;
}

const board = document.getElementById('board');

function paint(){
  board.innerHTML = render('dark');
  fitSheets();
}
function fitSheets(){
  const avail = document.querySelector('.board').clientWidth;
  const sheetPx = 210 * 96 / 25.4; // ~794
  const fit = Math.min(1, avail / sheetPx);
  document.querySelectorAll('.sheet').forEach(s => s.style.setProperty('--fit', fit));
}
window.addEventListener('resize', fitSheets);
paint();

// ── auto-print: wait for fonts + images, then open print dialog ──
async function readyToPrint(){
  try { await (document.fonts ? document.fonts.ready : Promise.resolve()); } catch(e){}
  const imgs = Array.from(document.images);
  await Promise.all(imgs.map(img => img.complete
    ? Promise.resolve()
    : new Promise(res => { img.onload = img.onerror = res; })));
  await new Promise(r => setTimeout(r, 500));
  window.print();
}
window.addEventListener('load', readyToPrint);
</script>
